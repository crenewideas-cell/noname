<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扩展工坊 · 无名杀</title>
<style>
:root{color-scheme:dark;--bg:#151916;--panel:#20251f;--line:#d4b98129;--gold:#e2c48d;--muted:#a7afa1;--danger:#f1a7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#3b3927 0,transparent 55%),var(--bg);color:#f0eddf;font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:9px;background:#171d18;padding:9px 13px}button{cursor:pointer;white-space:nowrap;transition:background .15s,border .15s}button:hover{background:#353b2d;border-color:#d4b98180}button:disabled{opacity:.45;cursor:wait}button.primary{background:var(--gold);color:#25281f;font-weight:650}button.danger{color:var(--danger);border-color:#dc8c803d}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}input[type=checkbox]{accent-color:#d7bd85;width:17px;height:17px}input[type=search]{width:100%}small,.muted{color:var(--muted)}small{display:block;overflow-wrap:anywhere}h1{font-size:30px;font-weight:600;letter-spacing:2px;margin:3px 0}h2{font-size:19px;margin:0}h3{font-size:15px;margin:0}p{margin:8px 0}header{padding:30px 32px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.shell{max-width:1680px;margin:auto;padding:22px 28px}.toolbar{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin-bottom:18px}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}.panel{background:#20251feb;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 10px 40px #0002}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line)}#packages{max-height:72vh;overflow:auto;padding:8px}.pack{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:9px;margin-bottom:4px}.pack.active{background:#c9ae7130;box-shadow:inset 3px 0 var(--gold)}.pack .select{border:0;background:none;text-align:left;flex:1;min-width:0;padding:0;white-space:normal}.detail-top{padding:22px;border-bottom:1px solid var(--line)}#path{font-family:ui-monospace,monospace;margin:5px 0 15px}.tabs{display:flex;gap:5px;padding:14px 22px 0}.tabs button{border:0;background:none;border-radius:0;border-bottom:2px solid transparent;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--gold);border-color:var(--gold)}.view{padding:18px 22px}.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row .label{flex:1;min-width:0}.row .actions button{padding:6px 10px;font-size:12px}.row .icon{display:grid;place-items:center;background:#ccb78015;color:var(--gold);border:1px solid var(--line);border-radius:8px;min-width:34px;height:34px}.list{max-height:51vh;overflow:auto}.badge{color:var(--gold);font-size:12px;background:#cab37918;border:1px solid var(--line);padding:3px 9px;border-radius:20px}.empty{padding:55px 22px;text-align:center;color:var(--muted)}#message{white-space:pre-wrap;border-radius:9px;margin-bottom:14px;color:var(--gold)}#message:not(:empty){padding:12px 16px;background:#e2c48d0d;border:1px solid var(--line)}dialog{background:#242920;color:#f0eddf;border:1px solid #d2b77c70;border-radius:16px;width:min(840px,94vw);max-height:90vh;overflow:auto;padding:26px;box-shadow:0 30px 100px #0008}dialog::backdrop{background:#080c0bcc;backdrop-filter:blur(5px)}dialog h2{color:var(--gold);margin-bottom:5px}dialog form{display:grid;gap:13px}dialog label{display:grid;gap:5px;color:var(--muted)}dialog input,dialog textarea,dialog select{width:100%;color:#f0eddf}dialog textarea{min-height:300px;resize:vertical;font:13px/1.6 ui-monospace,Consolas,monospace;tab-size:2}dialog .actions{justify-content:flex-end;padding-top:15px;border-top:1px solid var(--line)}#formError{color:var(--danger);white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 system-ui;background:#161c17;padding:16px;border-radius:9px;max-height:35vh;overflow:auto}.hint{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:950px){.layout{grid-template-columns:240px minmax(0,1fr)}.row{flex-wrap:wrap}.row .actions{margin-left:auto}.shell{padding:16px}.toolbar{grid-template-columns:1fr 150px}.toolbar>.actions{grid-column:1/-1}}@media(max-width:650px){header{padding:22px;align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}#packages{max-height:260px}.toolbar{grid-template-columns:1fr}.toolbar>.actions{grid-column:auto}.detail-top,.view{padding:16px}.tabs{padding-left:16px}h1{font-size:25px}}
</style></head><body>
<header><div><div class="eyebrow">NONAME / EXTENSION STUDIO</div><h1>扩展工坊</h1><p class="muted">整理目录，雕琢武将，将你的收藏打包带走。</p></div><div class="actions"><button id="createPack">＋ 新建扩展</button><button id="exportAll">导出全部</button><button id="exportSelected" class="primary">导出所选扩展</button></div></header>
<main class="shell"><div class="toolbar"><input id="search" type="search" aria-label="搜索扩展" placeholder="搜索扩展名称、目录"><select id="category" aria-label="扩展分类"><option value="">全部分类</option><option value="characters">独立武将</option><option value="packs">武将扩展包</option><option value="collections">合并扩展包</option><option value="ui">界面与特效</option><option value="imports">新导入待分类</option><option value="archived">已停用归档</option></select><div class="actions"><button id="selectVisible">选择当前结果</button><button id="clearSelection">清空选择</button><button id="refresh">刷新</button></div></div><div id="message" role="status" aria-live="polite"></div>
<div class="layout"><aside class="panel"><div class="panel-head actions"><h2>扩展目录</h2><span id="count" class="badge"></span></div><div id="packages"></div></aside><section class="panel"><div id="empty" class="empty"><h2>从左侧选择一个扩展</h2><p>浏览包内目录、查询武将、编辑源码或一键导出。</p></div><div id="detail" hidden><div class="detail-top"><div class="actions"><h2 id="title"></h2><span id="categoryLabel" class="badge"></span></div><small id="path"></small><div class="actions"><button id="exportPack" class="primary">导出此扩展</button><button id="newSub">＋ 新建子包</button><button id="movePack">调整分类目录</button><button id="deletePack" class="danger">物理删除</button></div></div>
<div class="tabs" role="tablist"><button id="tabCharacters" role="tab" aria-selected="true">武将资料</button><button id="tabFiles" role="tab" aria-selected="false">子包与源码</button></div>
<div id="charactersView" class="view"><div class="actions" style="margin-bottom:12px"><button id="addCharacter">＋ 新增武将</button><button id="selectCharacters">选择筛选结果</button><button id="exportCharacters">导出所选武将</button><span id="characterCount" class="badge"></span></div><input id="characterSearch" type="search" aria-label="搜索武将" placeholder="武将名称 / ID / 子包或文件路径"><p class="hint">选录保留原包技能与素材。技能 ID 可引用本体已有技能；复杂技能可在源码页编辑。</p><div id="characters" class="list"></div></div>
<div id="filesView" class="view" hidden><div class="actions"><button id="up">↑ 上一级</button><button id="root">扩展根目录</button><button id="newDir">＋ 目录</button><button id="newFile">＋ 文件</button><button id="exportDirectory">导出此目录武将</button><span id="breadcrumb" class="badge"></span></div><p class="hint">新建子包会自动加入主包；现有目录改名或删除前会检查源码引用。编辑保存后请重启游戏。</p><div id="files" class="list"></div></div></div></section></div></main>
<dialog id="editor"><form id="form"><div><h2 id="formTitle"></h2><p id="formHint" class="muted"></p></div><div id="fields"></div><div id="formError" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary" id="save">保存</button></div></form></dialog>
<script type="module">
const $=id=>document.getElementById(id), token=new URL(location.href).searchParams.get('key'), initial=new URL(location.href).searchParams.get('name');
let packages=[],characters=[],selected,path='',generation=0,working=false;const picks=new Set(),charPicks=new Set();let submitForm;
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
function button(label,action,cls){const e=text('button',label,cls);e.type='button';e.onclick=()=>run(action);return e}
function endpoint(route){const url=new URL('/__extensions'+route,location.origin);if(token)url.searchParams.set('key',token);return url}
async function api(route,data){const r=await fetch(endpoint(route),data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'操作失败');return v}
async function run(action){try{await action()}catch(e){$('message').textContent=e.message}}
function filteredPackages(){const q=$('search').value.trim().toLowerCase();return packages.filter(p=>(!$('category').value||p.category===$('category').value)&&(p.name+' '+p.path).toLowerCase().includes(q))}
function renderPackages(){$('packages').replaceChildren();for(const p of filteredPackages()){const row=text('div','', 'pack'+(selected?.name===p.name?' active':'')),check=document.createElement('input');check.type='checkbox';check.checked=picks.has(p.name);check.setAttribute('aria-label','选择 '+p.name);check.onchange=()=>{check.checked?picks.add(p.name):picks.delete(p.name);counts()};const choose=button('',()=>select(p),'select');choose.append(text('strong',p.name),text('small',p.categoryName+' · '+(p.registeredCharacters??'—')+' 个登记条目'));row.append(check,choose);$('packages').append(row)}if(!$('packages').children.length)$('packages').append(text('p','没有匹配的扩展','empty'));counts()}
function counts(){$('count').textContent=packages.length+' 包 / 已选 '+picks.size;$('exportSelected').disabled=!picks.size||working;$('characterCount').textContent=characters.length+' 位 / 已选 '+charPicks.size;$('exportCharacters').disabled=!charPicks.size||working}
function filteredCharacters(){const q=$('characterSearch').value.trim().toLowerCase();return characters.filter(c=>(c.name+' '+c.id+' '+c.files.join(' ')).toLowerCase().includes(q))}
function renderCharacters(){$('characters').replaceChildren();for(const c of filteredCharacters()){const row=text('div','','row'),check=document.createElement('input');check.type='checkbox';check.checked=charPicks.has(c.id);check.setAttribute('aria-label','选择 '+c.name);check.onchange=()=>{check.checked?charPicks.add(c.id):charPicks.delete(c.id);counts()};const label=text('div','','label');label.append(text('strong',c.name),text('small',c.id),text('small',c.files.join(' · ')));const actions=text('div','','actions');actions.append(button('编辑',()=>editCharacter(c)),button('单独导出',()=>exportData({packages:[{name:selected.name,characters:[c.id]}]})),button('删除',()=>deletion(c.id),'danger'));row.append(check,label,actions);$('characters').append(row)}if(!$('characters').children.length)$('characters').append(text('p','未找到静态武将定义；动态注册的内容可在源码页查询。','empty'));counts()}
async function select(p){selected=p;path='';charPicks.clear();const version=++generation;$('detail').hidden=false;$('empty').hidden=true;$('title').textContent=p.name;$('path').textContent=p.path;$('categoryLabel').textContent=p.categoryName;renderPackages();$('characters').textContent='正在读取武将定义…';const rows=await api('/characters?name='+encodeURIComponent(p.name));if(version!==generation)return;characters=rows;renderCharacters();await browse('')}
async function refresh(){packages=await api('/packages');for(const name of picks)if(!packages.some(p=>p.name===name))picks.delete(name);const current=packages.find(p=>p.name===selected?.name||!selected&&p.name===initial);renderPackages();if(current)await select(current);else{selected=null;characters=[];generation++;$('detail').hidden=true;$('empty').hidden=false}}
async function browse(relative){const name=selected.name,version=generation,result=await api('/directory?'+new URLSearchParams({name,path:relative}));if(version!==generation)return;path=result.path;$('breadcrumb').textContent=path||'根目录';$('up').disabled=!path;$('files').replaceChildren();for(const item of result.entries){const row=text('div','','row'),label=text('div','','label');label.append(text('strong',item.name),text('small',item.directory?'目录 / 子包':item.editable?'可编辑源码':'资源文件'));const actions=text('div','','actions');if(item.directory)actions.append(button('打开',()=>browse(item.path)));else if(item.editable)actions.append(button('编辑',()=>editSource(item.path)));actions.append(button('改名',()=>renamePath(item)),button('删除',()=>deletePath(item),'danger'));row.append(text('span',item.directory?'▦':'≡','icon'),label,actions);$('files').append(row)}if(!result.entries.length)$('files').append(text('p','这个目录还是空的。','empty'))}
function tab(files){$('filesView').hidden=!files;$('charactersView').hidden=files;$('tabFiles').setAttribute('aria-selected',String(files));$('tabCharacters').setAttribute('aria-selected',String(!files))}
function modal(title,hint,fields,action,label='保存'){$('formTitle').textContent=title;$('formHint').textContent=hint;$('fields').replaceChildren(...fields);$('formError').textContent='';$('save').textContent=label;submitForm=action;$('editor').showModal();$('fields').querySelector('input,textarea,select')?.focus()}
function field(label,value='',type='text'){const wrap=text('label',label);wrap.style.marginBottom='12px';const input=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');if(type!=='textarea'&&type!=='select')input.type=type;input.value=value;wrap.append(input);return{wrap,input}}
function options(field,items,current){for(const [value,label]of items){const o=text('option',label);o.value=value;field.input.append(o)}field.input.value=current||items[0]?.[0]}
const categories=[...$('category').options].filter(o=>o.value).map(o=>[o.value,o.textContent]);
async function editSource(relative){const name=selected.name,source=await api('/source?'+new URLSearchParams({name,path:relative})),code=field('源码',source.text,'textarea');modal('编辑源码',relative+' · 保存时检查语法及文件版本。',[code.wrap],async()=>{await api('/source',{name,path:relative,revision:source.revision,text:code.input.value});await refresh()})}
async function editCharacter(c){const name=selected.name;let file=c.files[0];if(c.files.length>1){const choice=field('定义文件','','select');options(choice,c.files.map(f=>[f,f]));modal('选择定义',c.id,[choice.wrap],async()=>{file=choice.input.value;$('editor').close();await open()});return}await open();async function open(){const info=await api('/character?'+new URLSearchParams({name,id:c.id,path:file})),value=field('武将定义（数组或对象）',info.definition,'textarea');modal('编辑 '+c.name,c.id+' · '+file,[value.wrap],async()=>{await api('/character/save',{...info,name,definition:value.input.value});await refresh()})}}
async function deletion(id){const name=selected.name,plan=await api('/plan',{name,id}),confirm=field('输入扩展完整名称确认');modal(id?'删除武将':'物理删除扩展','请核对以下范围，保存中的源码不会自动合并。',[text('pre',plan.path+'\n\n'+plan.summary.join('\n\n')),confirm.wrap],async()=>{await api('/delete',{token:plan.token,confirm:confirm.input.value});await refresh()},'确认删除')}
function renamePath(item){const name=selected.name,leaf=field('新名称',item.name);modal('重命名目录 / 文件',item.path,[leaf.wrap],async()=>{await api('/path/change',{name,path:item.path,action:'rename',leaf:leaf.input.value});await browse(path)})}
function deletePath(item){const name=selected.name,confirm=field('输入完整相对路径确认', '');modal('删除目录 / 文件',item.directory?'将删除目录及所有子目录和素材。源码引用未解除时会停止。':'将物理删除此文件。',[text('pre',item.path),confirm.wrap],async()=>{await api('/path/change',{name,path:item.path,action:'delete',confirm:confirm.input.value});await refresh()},'确认删除')}
async function exportData(data){if(working)return;working=true;document.querySelectorAll('header button').forEach(b=>b.disabled=true);counts();$('message').textContent='正在整理源码、技能和素材并生成 ZIP，大型合集可能需要较长时间…';try{const result=await api('/export',data),a=document.createElement('a');a.href=endpoint('/download?token='+encodeURIComponent(result.token));a.download=result.filename;a.textContent='下载 '+result.filename;$('message').replaceChildren(text('span','导出完成。'),a);a.click()}finally{working=false;document.querySelectorAll('header button').forEach(b=>b.disabled=false);counts()}}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('cancel').disabled=true;const action=submitForm;try{await action();if(submitForm===action)$('editor').close();$('message').textContent='操作已保存。游戏中已加载的内容需重启后生效。'}catch(error){$('formError').textContent=error.message}finally{$('save').disabled=false;$('cancel').disabled=false}};$('cancel').onclick=()=>$('editor').close();$('editor').addEventListener('cancel',e=>{if($('save').disabled)e.preventDefault()});
$('createPack').onclick=()=>{const name=field('扩展名称'),category=field('分类','','select');options(category,categories,'imports');modal('新建扩展','创建可直接加载与导出的 ESM 扩展骨架；重启后在扩展页启用。',[name.wrap,category.wrap],async()=>{const created=await api('/package/create',{name:name.input.value,category:category.input.value});await refresh();await select(packages.find(p=>p.name===created.name))})};
$('newSub').onclick=()=>{const name=selected.name,leaf=field('子包名称');modal('新建子包','自动加入当前主包的加载清单，可在子包 extension.js 中新增武将。',[leaf.wrap],async()=>{const result=await api('/subpackage/create',{name,leaf:leaf.input.value});await refresh();await browse(result.path);tab(true)})};
$('newDir').onclick=()=>{const name=selected.name,parent=path,leaf=field('目录名称');modal('新建目录',parent||'扩展根目录',[leaf.wrap],async()=>{await api('/directory/create',{name,path:parent,leaf:leaf.input.value});await browse(parent)})};
$('newFile').onclick=()=>{const name=selected.name,parent=path,leaf=field('文件名称','custom.js');modal('新建源码文件',parent||'扩展根目录',[leaf.wrap],async()=>{await api('/source/create',{name,path:parent,leaf:leaf.input.value});await browse(parent)})};
$('exportDirectory').onclick=()=>run(()=>{const ids=characters.filter(c=>c.files.some(file=>!path||file.startsWith(path+'/'))).map(c=>c.id);if(!ids.length)throw Error('此目录未找到静态武将定义');return exportData({packages:[{name:selected.name,characters:ids}]})});
$('movePack').onclick=()=>{const name=selected.name,category=field('目标分类','','select');options(category,categories,selected.category);modal('调整分类目录','保留扩展身份与游戏内资源地址，仅移动整个源目录。',[category.wrap],async()=>{await api('/package/move',{name,category:category.input.value});await refresh()})};
$('addCharacter').onclick=()=>{const name=selected.name,id=field('唯一 ID（例：custom_liubei）'),title=field('显示名称'),file=field('保存到哪个源码文件',path?path+'/extension.js':'extension.js'),sex=field('性别','','select'),group=field('势力','shu'),hp=field('体力','4','number'),skills=field('技能 ID，以英文逗号分隔');options(sex,[['male','男'],['female','女'],['double','双性'],['none','无']]);modal('新增武将','填写已有技能 ID；若定义文件结构复杂，可先新建子包，再在该子包内新增。',[file.wrap,id.wrap,title.wrap,sex.wrap,group.wrap,hp.wrap,skills.wrap],async()=>{await api('/character/create',{name,file:file.input.value,id:id.input.value,title:title.input.value,sex:sex.input.value,group:group.input.value,hp:Number(hp.input.value),skills:skills.input.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean)});await refresh()})};
$('exportAll').onclick=()=>run(()=>exportData({all:true}));$('exportSelected').onclick=()=>run(()=>exportData({packages:[...picks].map(name=>({name}))}));$('exportPack').onclick=()=>run(()=>exportData({packages:[{name:selected.name}]}));$('exportCharacters').onclick=()=>run(()=>exportData({packages:[{name:selected.name,characters:[...charPicks]}]}));$('selectVisible').onclick=()=>{filteredPackages().forEach(p=>picks.add(p.name));renderPackages()};$('clearSelection').onclick=()=>{picks.clear();charPicks.clear();renderPackages();renderCharacters()};$('selectCharacters').onclick=()=>{filteredCharacters().forEach(c=>charPicks.add(c.id));renderCharacters()};$('search').oninput=renderPackages;$('category').onchange=renderPackages;$('characterSearch').oninput=renderCharacters;$('refresh').onclick=()=>run(refresh);$('deletePack').onclick=()=>run(()=>deletion());$('tabFiles').onclick=()=>tab(true);$('tabCharacters').onclick=()=>tab(false);$('up').onclick=()=>run(()=>browse(path.split('/').slice(0,-1).join('/')));$('root').onclick=()=>run(()=>browse(''));run(refresh);
</script></body></html>
