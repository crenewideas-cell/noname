<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>扩展文件管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#202b3c;font:15px/1.6 system-ui,sans-serif}main{max-width:1180px;margin:36px auto;padding:0 24px}h1{margin-bottom:4px}p{color:#576477}input,select,button{font:inherit;border:1px solid #c5cdd9;border-radius:7px;padding:9px 12px;background:white}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:12px;margin:24px 0}.toolbar input{flex:1}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(340px,1.5fr);gap:20px}.panel{background:white;border:1px solid #dce2eb;border-radius:12px;padding:20px;min-width:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #edf0f5;padding:14px 0}.row button{flex-shrink:0}.selected{background:#edf4ff}small{display:block;color:#66758b;overflow-wrap:anywhere}.danger{color:#b32232;border-color:#e9a8af}#message{white-space:pre-wrap;color:#a12232}#packages,#characters{max-height:65vh;overflow:auto}dialog{border:1px solid #c5cdd9;border-radius:12px;max-width:700px;width:90%;max-height:85vh;overflow:auto;padding:26px}dialog::backdrop{background:#18243d99}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f3f5f8;padding:16px}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}#characterSearch{width:100%;margin:12px 0}@media(max-width:750px){.layout{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}
</style>
<main><h1>扩展文件管理</h1><p>按类型浏览源文件，管理整包或包内武将。物理删除前会显示范围，并要求输入扩展名称确认。</p>
<div class="toolbar"><input id="search" placeholder="搜索扩展名称"><select id="category"><option value="">全部分类</option><option value="characters">独立武将</option><option value="packs">武将扩展包</option><option value="collections">合并扩展包</option><option value="ui">界面与特效</option><option value="archived">已停用归档</option><option value="imports">新导入待分类</option></select><button id="refresh">刷新</button></div>
<div id="message" role="status"></div><div class="layout"><section class="panel"><h2>扩展目录</h2><div id="packages"></div></section><section class="panel"><h2 id="title">选择一个扩展</h2><p id="description">整包删除包含内部全部子包和资源；包内武将删除会修改源文件中的定义。</p><button id="deletePack" class="danger" hidden>删除整个扩展</button><input id="characterSearch" placeholder="搜索武将名称、ID 或来源文件" hidden><div id="characters"></div></section></div>
</main>
<dialog id="confirmation"><h2>确认物理删除</h2><pre id="preview"></pre><label>输入扩展完整名称 <strong id="expected"></strong> 确认：<input id="confirmName" autocomplete="off" style="width:100%;margin-top:10px"></label><p id="deleteError" role="alert"></p><div class="actions"><button id="cancel">取消</button><button id="commit" class="danger" disabled>确认并永久删除</button></div></dialog>
<script type="module">
const $=id=>document.getElementById(id), key=new URL(location.href).searchParams.get('key');
let packages=[], characters=[], selected, pending, revision=0, deleting=false;
async function api(route,data){const response=await fetch(route+(route.includes('?')?'&':'?')+'key='+encodeURIComponent(key),data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await response.json();if(!response.ok)throw Error(value.error||'操作失败');return value}
const report=error=>$('message').textContent=error.message;
function text(tag,value){const element=document.createElement(tag);element.textContent=value;return element}
function renderPackages(){const term=$('search').value.toLowerCase();$('packages').replaceChildren();for(const pack of packages.filter(pack=>(!$('category').value||pack.category===$('category').value)&&pack.name.toLowerCase().includes(term))){const row=text('div','');row.className='row'+(selected?.name===pack.name?' selected':'');const label=text('div',pack.name);label.append(text('small',pack.categoryName+' · '+(pack.registeredCharacters===null?'未登记武将数量':pack.registeredCharacters+' 个登记条目')));const button=text('button','管理');button.onclick=()=>select(pack).catch(report);row.append(label,button);$('packages').append(row)}if(!$('packages').children.length)$('packages').append(text('p','没有匹配的扩展。'))}
function renderCharacters(){const term=$('characterSearch').value.toLowerCase();$('characters').replaceChildren();for(const character of characters.filter(row=>(row.name+' '+row.id+' '+row.files.join(' ')).toLowerCase().includes(term))){const row=text('div','');row.className='row';const label=text('div',character.name);label.append(text('small',character.id),text('small',character.files.join('、')));const button=text('button','删除武将');button.className='danger';button.onclick=()=>preview(character.id).catch(report);row.append(label,button);$('characters').append(row)}if(!$('characters').children.length)$('characters').append(text('p','没有匹配的静态武将定义。动态注册的内容需编辑源码，或选择删除整个扩展。'))}
async function select(pack){selected=pack;const version=++revision;characters=[];renderPackages();$('title').textContent=pack.name;$('description').textContent=pack.path+'。登记数量可能包含动态内容，以下列表按源码定义显示。';$('deletePack').hidden=false;$('characterSearch').hidden=false;$('characterSearch').value='';$('characters').textContent='正在读取武将定义…';const rows=await api('/characters?name='+encodeURIComponent(pack.name));if(version!==revision)return;characters=rows;renderCharacters()}
async function refresh(){packages=await api('/packages');renderPackages();if(selected){const pack=packages.find(pack=>pack.name===selected.name);if(pack)await select(pack);else{selected=null;revision++;$('title').textContent='选择一个扩展';$('characters').replaceChildren();$('deletePack').hidden=true;$('characterSearch').hidden=true}}}
async function preview(id){$('message').textContent='正在准备删除范围…';const pack=selected;const result=await api('/plan',{name:pack.name,id});pending=result;$('message').textContent='';$('preview').textContent=result.path+'\n\n'+result.summary.join('\n\n');$('expected').textContent=result.name;$('confirmName').value='';$('deleteError').textContent='';$('commit').disabled=true;$('confirmation').showModal();$('confirmName').focus()}
$('confirmName').oninput=()=>{$('commit').disabled=!pending||$('confirmName').value!==pending.name};
$('cancel').onclick=()=>{if(!deleting)$('confirmation').close()};$('confirmation').addEventListener('cancel',event=>{if(deleting)event.preventDefault()});
$('commit').onclick=async()=>{deleting=true;$('commit').disabled=true;$('cancel').disabled=true;$('confirmName').disabled=true;try{await api('/delete',{token:pending.token,confirm:$('confirmName').value});$('confirmation').close();pending=null;$('message').textContent='已完成物理删除。请重新启动游戏；已有构建产物需重新打包。';await refresh()}catch(error){$('deleteError').textContent=error.message}finally{deleting=false;$('cancel').disabled=false;$('confirmName').disabled=false;$('commit').disabled=true}};
$('search').oninput=renderPackages;$('category').onchange=renderPackages;$('characterSearch').oninput=renderCharacters;$('refresh').onclick=()=>refresh().catch(report);$('deletePack').onclick=()=>preview().catch(report);refresh().catch(report);
</script>
</html>
