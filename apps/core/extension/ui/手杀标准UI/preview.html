<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手杀标准UI · 原版参考</title>
<style>html,body{height:100%;margin:0;background:#211d18;color:#ebd6a3;font:14px sans-serif}main{height:100%;display:flex;flex-direction:column}nav{display:flex;align-items:center;gap:12px;padding:8px}button{color:inherit;background:#493c25;border:1px solid #ac925d;border-radius:4px;padding:5px 10px;cursor:pointer}img{display:block;width:100%;min-height:0;flex:1;object-fit:contain}small{padding:6px 10px;color:#c9b88f}</style>
<main><nav><span id="title"></span><button id="selection">选将参考</button><button id="arena">对局参考</button></nav><img id="scene" alt="手杀标准UI界面参考"><small>原版参考图（用户提供）。实际界面由原版程序渲染，请应用套装后体验；本页不启动对局。</small></main>
<script>const initial=new URLSearchParams(location.search).get('preview');function show(name){document.getElementById('scene').src='reference/'+name+'.png';document.getElementById('title').textContent={home:'大厅原版参考',selection:'选将原版参考',arena:'对局原版参考'}[name];}document.getElementById('selection').onclick=()=>show('selection');document.getElementById('arena').onclick=()=>show('arena');show(initial==='home'?'home':'arena');</script></html>
