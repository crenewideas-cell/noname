<!doctype html>

<head>
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="user-scalable=no, viewport-fit=cover" />
	<title>无名杀</title>
	<script>
		if (new URLSearchParams(location.search).get("perf") === "1") {
			performance.setResourceTimingBufferSize(4096);
			performance.mark("noname:html");
		}
	</script>
	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>
	<script type="module" src="./noname/entry.ts"></script>
</head>
<body>
	<div id="noname-boot-status" role="status" style="position:fixed;inset:0;z-index:99999;display:grid;place-content:center;background:#172326;color:#e9e1d1;font:16px/1.8 system-ui,sans-serif;text-align:center;pointer-events:none">
		<strong style="font-size:26px;letter-spacing:.2em">无名杀</strong>
		<span>正在载入游戏…</span>
	</div>
	<script>
		// Paint the selected UI before the game/module graph loads. Only a fixed,
		// known local appearance is cached here; no package HTML/code is executed.
		try {
			const status = document.getElementById("noname-boot-status");
			const safe = new URLSearchParams(location.search).has("uiSafe");
			window.nonameApplyBootAppearance = function (runtime) {
				if (!status.isConnected || safe) return;
				status.style.visibility = "visible";
				if (status.dataset.runtime === runtime) return;
				status.dataset.runtime = runtime || "default";
				if (runtime === "shousha") {
					status.style.background = "#211a12 url('extension/手杀标准UI/original/如真似幻/images/hom.jpg') center/100% 100%";
					const frame = document.createElement("iframe");
					frame.title = "手杀标准UI · 加载中";
					frame.src = "extension/手杀标准UI/boot.html";
					frame.style.cssText = "position:absolute;inset:0;width:100%;height:100%;border:0";
					status.replaceChildren(frame);
					return;
				}
				status.innerHTML = '<strong style="font-size:26px;letter-spacing:.2em">无名杀</strong><span>正在载入游戏…</span>';
				if (runtime !== "rzsh") { status.style.background = "#172326"; return; }
				status.style.background = "#211a12 url('extension/如真似幻/images/hom.jpg') center/cover";
				status.style.color = "#dfc594";
				const logo = status.querySelector("strong");
				logo.textContent = ""; logo.setAttribute("aria-label", "无名杀");
				logo.style.cssText = "display:block;width:528px;height:224px;background:url('extension/如真似幻/spine/loding.png') -657px -170px;transform:scale(.8);margin:auto";
				status.querySelector("span").textContent = "加载中 · · ·";
			};
			const cached = localStorage.getItem("noname-ui-workshop-boot");
			if (cached || safe) window.nonameApplyBootAppearance(cached);
			else {
				// Upgrade older installations whose selected suite was only in IDB.
				// Read the existing config; never install a suite or create a database.
				status.style.visibility = "hidden";
				const reveal = setTimeout(() => { status.style.visibility = "visible"; }, 1500);
				let prefix = "noname_0.9_";
				if (typeof __dirname === "string" && __dirname.length) {
					for (const part of __dirname.split("/")) if (part) prefix += /[A-Za-z]/.test(part[0]) ? part[0] : "_";
					prefix += "_";
				}
				const request = indexedDB.open(prefix + "data");
				const finish = runtime => { clearTimeout(reveal); window.nonameApplyBootAppearance(runtime); };
				request.onupgradeneeded = () => request.transaction.abort();
				request.onerror = () => finish("default");
				request.onsuccess = () => {
					const db = request.result;
					if (!db.objectStoreNames.contains("config") || !db.objectStoreNames.contains("data")) { db.close(); finish("default"); return; }
					const transaction = db.transaction(["config", "data"], "readonly");
					transaction.oncomplete = () => db.close();
					transaction.onabort = () => { db.close(); finish("default"); };
					const selected = transaction.objectStore("config").get("ui_workshop_active");
					selected.onsuccess = () => {
						if (["builtin-shousha-standard", "shousha-standard"].includes(selected.result)) { finish("shousha"); return; }
						const pack = transaction.objectStore("data").get("ui-workshop:" + selected.result);
						pack.onsuccess = () => finish(pack.result?.manifest?.components?.home?.runtime || "default");
					};
				};
			}
		} catch {}
	</script>
</body>
